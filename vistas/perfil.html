<!DOCTYPE html>
<html lang="es-co">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../assets/favicon/favicon.ico" />
    <title>Club Acerías - Mi Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/EstilosGLobales/global.css">
    <link rel="stylesheet" href="../assets/css/perfil.css">
</head>

<body>

    <nav class="top-navbar d-flex justify-content-between align-items-center flex-wrap gap-2">
        <h1 class="brand-title">
            <i class="bi bi-person-circle"></i> Club Acerías
        </h1>
        <a href="dashboard.html" class="btn-nav-back">
            <i class="bi bi-arrow-left-circle"></i> Volver al panel
        </a>
    </nav>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="perfil-card p-4">
                    <div class="perfil-header d-flex align-items-center gap-3 pb-3 mb-4">
                        <div class="perfil-icono rounded-circle">
                            <i class="bi bi-person-badge fs-2"></i>
                        </div>
                        <div>
                            <h2 class="h4 mb-1 text-white fw-bold">Mi Perfil</h2>
                            <p class="perfil-subtexto mb-0">Información personal y de membresía en el club</p>
                        </div>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label perfil-subtexto small fw-bold">Nombre del Asociado</label>
                            <div class="perfil-campo fw-semibold" id="perfilNombre">Cargando...</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label perfil-subtexto small fw-bold">Rol asignado</label>
                            <div class="perfil-campo fw-semibold text-capitalize" id="perfilRol">Cargando...</div>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label perfil-subtexto small fw-bold">Correo Electrónico</label>
                            <div class="perfil-campo" id="perfilEmail">Cargando...</div>
                        </div>
                    </div>

                    <div class="perfil-pie mt-4 pt-3 text-end">
                        <a href="dashboard.html" class="btn-perfil-volver">
                            <i class="bi bi-arrow-left"></i> Volver al Dashboard
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const nombre = localStorage.getItem('nombre') || 'Asociado';
            const rol = localStorage.getItem('rol') || 'asociado';
            const email = localStorage.getItem('email') || 'No registrado';

            document.getElementById('perfilNombre').textContent = nombre;
            document.getElementById('perfilRol').textContent = rol;
            document.getElementById('perfilEmail').textContent = email;
        });
    </script>
</body>

</html>
