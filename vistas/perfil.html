<!DOCTYPE html>
<html lang="es-co">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Frambuesa - Mi Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/Registros.css">
</head>

<body class="bg-light">

    <nav class="top-navbar d-flex justify-content-between align-items-center">
        <h1 class="brand-title">
            <i class="bi bi-person-circle"></i> Club Frambuesa
        </h1>
        <a href="dashboard.html" class="btn-nav-back">
            <i class="bi bi-arrow-left-circle"></i> Volver al panel
        </a>
    </nav>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="form-card shadow-sm p-4">
                    <div class="form-header d-flex align-items-center gap-3 pb-3 mb-4 border-bottom">
                        <div class="header-icon-box bg-primary text-white p-3 rounded-circle">
                            <i class="bi bi-person-badge fs-2"></i>
                        </div>
                        <div>
                            <h2 class="h4 mb-1">Mi Perfil</h2>
                            <p class="text-muted mb-0">Información personal y de membresía en el club</p>
                        </div>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label text-muted small">Nombre del Asociado</label>
                            <div class="p-2 bg-light rounded fw-semibold" id="perfilNombre">Cargando...</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted small">Rol asignado</label>
                            <div class="p-2 bg-light rounded fw-semibold text-capitalize text-primary" id="perfilRol">Cargando...</div>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label text-muted small">Correo Electrónico</label>
                            <div class="p-2 bg-light rounded" id="perfilEmail">Cargando...</div>
                        </div>
                    </div>

                    <div class="mt-4 pt-3 border-top text-end">
                        <a href="dashboard.html" class="btn btn-club-primary">
                            <i class="bi bi-arrow-left"></i> Volver al Dashboard
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const nombre = localStorage.getItem('nombre') || 'Asociado';
            const rol = localStorage.getItem('rol') || 'asociado';
            const email = localStorage.getItem('email') || 'No registrado';

            document.getElementById('perfilNombre').textContent = nombre;
            document.getElementById('perfilRol').textContent = rol;
            document.getElementById('perfilEmail').textContent = email;
        });
    </script>
</body>
</html>
