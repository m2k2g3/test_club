<!DOCTYPE html>
<html lang="es-co">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../assets/favicon/favicon.ico" />
    <title>Club Acerías - Registro de Actividades</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/EstilosGLobales/global.css">
    <link rel="stylesheet" href="../assets/css/Registros_actividades.css">
</head>

<body>

    <header class="header-mr">
        <h1>Actividades del club</h1>
        <a class="btn-volver" href="dashboard.html">
            <i class="bi bi-arrow-left"></i>
            Volver al panel
        </a>
    </header>

    <main class="contenedor-principal">

        <div class="barra-acciones">
            <p class="descripcion-pagina">
                Consulta las actividades programadas y su información.
            </p>
            <button id="nuevaActividad" class="btn-nueva d-none" type="button">
                <i class="bi bi-plus-lg"></i>
                Nueva actividad
            </button>
        </div>

        <div class="tarjeta-tabla">
            <div class="table-responsive">
                <table class="table tabla-actividades">
                    <thead>
                        <tr>
                            <th scope="col">Actividad</th>
                            <th scope="col">Fecha</th>
                            <th scope="col">Municipio</th>
                            <th scope="col">Total recaudado</th>
                            <th id="encabezadoAcciones" class="d-none" scope="col">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="listaActividades">
                        <tr>
                            <td colspan="5" class="cargando-fila">
                                Cargando actividades ...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Contenedor de Alertas Toast -->
    <div class="toast-container">
        <div id="toastActividad" class="toast toast-actividad" role="status" aria-live="polite" aria-atomic="true">
            <div class="toast-contenido">
                <div id="mensajeActividades" class="toast-body"></div>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Cerrar"></button>
            </div>
        </div>
    </div>

    <!-- Modal de Actividad -->
    <div class="modal fade" id="modalActividad" tabindex="-1" aria-labelledby="tituloModalActividad" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content modal-actividad">
                <form id="formActividad">
                    <div class="modal-header">
                        <h2 class="modal-title" id="tituloModalActividad">
                            Nueva actividad
                        </h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>

                    <div class="modal-body">
                        <input type="hidden" id="idActividad" />

                        <div class="campo-grupo">
                            <label for="nombreActividad" class="form-label">
                                Nombre de la actividad
                            </label>
                            <input type="text" class="form-control" id="nombreActividad" maxlength="100" required>
                        </div>

                        <div class="campo-grupo">
                            <label for="fechaEvento" class="form-label">Fecha del evento</label>
                            <input type="date" class="form-control" id="fechaEvento" required />
                        </div>

                        <div class="campo-grupo">
                            <label for="municipio" class="form-label">Municipio</label>
                            <input type="text" class="form-control" id="municipio" maxlength="50" required />
                        </div>

                        <div id="campoTotalRecaudado" class="campo-grupo d-none">
                            <label for="totalRecaudado" class="form-label">
                                Total recaudado (opcional; completar al finalizar)
                            </label>
                            <input type="number" class="form-control" id="totalRecaudado" min="0" step="0.01"
                                placeholder="Ej.: 1500000.00" />
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn-cancelar" data-bs-dismiss="modal">Cancelar</button>
                        <button id="guardarActividad" type="submit" class="btn-guardar">Guardar actividad</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../controler/modal.js"></script>
    <script src="../controler/actividades.js"></script>
</body>

</html>
