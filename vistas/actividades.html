<!DOCTYPE html>
<html lang="es-co">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Frambuesa - Registro de Actividades</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/Registros.css">
</head>

<body class="bg-light">

  
    <header class="header-mr d-flex justify-content-between align-items-center gap-3 p-3 bg-dark text-white">
        <h1 class="h3 mb-0">Actividades del club</h1>
        <a class="btn btn-outline-light" href="dashboard.html">
            <i class="bi bi-arrow-left"></i>
            Volver al panel
        </a>
    </header>

    <main class="container py-4">
       
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-3">
            <p class="mb-0 text-muted">
                Consulta las actividades programadas y su información.
            </p>
            <button id="nuevaActividad" class="btn btn-success d-none" type="button">
                <i class="bi bi-plus-lg"></i>
                Nueva actividad
            </button>
        </div>

        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th scope="col">Actividad</th>
                            <th scope="col">Fecha</th>
                            <th scope="col">Municipio</th>
                            <th scope="col">Total recaudado</th>
                            <th id="encabezadoAcciones" class="d-none" scope="col">
                                Acciones
                            </th>
                        </tr>
                    </thead>
                    <tbody id="listaActividades">
                        <tr>
                            <td colspan="5" class="text-center py-4">
                                Cargando actividades ...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Contenedor de Alertas Toast -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toastActividad" class="toast align-items-center text-bg-success border-0" role="status"
            aria-live="polite" aria-atomic="true">
            <div class="d-flex">
                <div id="mensajeActividades" class="toast-body"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Cerrar"></button>
            </div>
        </div>
    </div>

    <!-- Modal de Actividad -->
    <div class="modal fade" id="modalActividad" tabindex="-1" aria-labelledby="tituloModalActividad" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="formActividad">
                    <div class="modal-header">
                        <h2 class="modal-title fs-5" id="tituloModalActividad">
                            Nueva actividad
                        </h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    
                    <!-- 3. CORREGIDO: Todos los inputs y campos ahora están dentro del modal-body -->
                    <div class="modal-body">
                        <input type="hidden" id="idActividad" />

                        <div class="mb-3">
                            <label for="nombreActividad" class="form-label">
                                Nombre de la actividad
                            </label>
                            <input type="text" class="form-control" id="nombreActividad" maxlength="100" required>
                        </div>

                        <div class="mb-3">
                            <label for="fechaEvento" class="form-label">Fecha del evento</label>
                            <input type="date" class="form-control" id="fechaEvento" required />
                        </div>

                        <div class="mb-3">
                            <label for="municipio" class="form-label">Municipio</label>
                            <input type="text" class="form-control" id="municipio" maxlength="50" required />
                        </div>

                        <div id="campoTotalRecaudado" class="mb-3 d-none">
                            <label for="totalRecaudado" class="form-label">
                                Total recaudado (opcional; completar al finalizar)
                            </label>
                            <input type="number" class="form-control" id="totalRecaudado" min="0" step="0.01"
                                placeholder="Ej .: 1500000.00" />
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button id="guardarActividad" type="submit" class="btn btn-primary">Guardar actividad</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 4. CORREGIDO: Se eliminó el espacio en la ruta de acceso al JS -->
    <script src="../Controladores/actividades.js"></script>
</body>

</html>
